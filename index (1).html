  /* การ์ดตัวเลข */
  .value {
    position: absolute; top: calc(359 * var(--u));
    width: calc(172 * var(--u)); height: calc(176 * var(--u));
    display: flex; align-items: center; justify-content: center;
    font-family: "Kanit", sans-serif; font-weight: 500;
    font-size: calc(84 * var(--u)); color: #000;
    transition: transform .25s ease;
  }
  .value.pop { transform: scale(1.08); }

  /* Toggle */
  .toggle {
    position: absolute; top: calc(625 * var(--u));
    width: calc(216 * var(--u)); height: calc(68 * var(--u));
    cursor: pointer; touch-action: none; outline: none;
  }
  .track {
    position: absolute; left: 0; right: 0;
    top: calc(2 * var(--u)); height: calc(64 * var(--u));
    background: #ff9985;
    border-radius: calc(32 * var(--u));   /* ราง pill โค้งมนทั้งสองด้าน */
    transition: background .25s ease;
  }
  .toggle.on .track { background: #7ba043; }
  .knob {
    position: absolute; left: 0; top: calc(2 * var(--u));
    width: calc(64 * var(--u)); height: calc(64 * var(--u));
    box-sizing: border-box;
    border-radius: 50%; background: #c8cfdb;
    border: calc(3.5 * var(--u)) solid #000;
    transition: left .25s ease;
  }
  .toggle.dragging .knob { transition: none; }
  .toggle:focus-visible .knob { box-shadow: 0 0 0 calc(5 * var(--u)) rgba(123,160,67,.6); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- สร้างการ์ด + ป้าย + toggle ด้วย JS -->
</div>

<script>
  // ตำแหน่ง (หน่วยพิกเซลของรูปต้นฉบับ 1920x1080) — คงเค้าโครงเดิมไว้ทุกอย่าง
  const items = [
    { name: "อุณหภูมิ", card: 381,  toggle: 363 },
    { name: "ความชื้น", card: 767,  toggle: 743 },
    { name: "ค่าแสง",   card: 1102, toggle: 1082 },
    { name: "ระดับน้ำ", card: 1464, toggle: 1443 }
  ];
  const TRAVEL = 152;          // ระยะเลื่อนของปุ่มกลม (216 - 64)
  const INTERVAL = 1200;       // สุ่มเลขใหม่ทุก 1.2 วินาที เมื่อเปิด toggle
  const stage = document.getElementById("stage");

  const MIN_VALUE = 6;         // ค่าต่ำสุดที่สุ่มได้
  const MAX_VALUE = 9;         // ค่าสูงสุดที่สุ่มได้
  const rand = () => Math.floor(Math.random() * (MAX_VALUE - MIN_VALUE + 1)) + MIN_VALUE;

  items.forEach((it) => {
    // การ์ดตัวเลข
    const val = document.createElement("div");
    val.className = "value";
    val.style.left = `calc(${it.card} * var(--u))`;
    val.textContent = rand();

    // toggle
    const tg = document.createElement("div");
    tg.className = "toggle";
    tg.tabIndex = 0;
    tg.setAttribute("role", "switch");
    tg.setAttribute("aria-checked", "false");
    tg.setAttribute("aria-label", it.name);
    tg.style.left = `calc(${it.toggle} * var(--u))`;
    tg.innerHTML = '<div class="track"></div><div class="knob"></div>';
    const knob = tg.querySelector(".knob");

    let timer = null;
    let on = false;

    function update() {
      val.textContent = rand();
      val.classList.add("pop");
      setTimeout(() => val.classList.remove("pop"), 250);
    }

    function setOn(state) {
      on = state;
      tg.classList.toggle("on", on);
      tg.setAttribute("aria-checked", on);
      knob.style.left = on ? `calc(${TRAVEL} * var(--u))` : "0";
      clearInterval(timer);
      if (on) { update(); timer = setInterval(update, INTERVAL); }
    }

    // คลิก / ลาก
    let startX = 0, moved = false, dragging = false;
    tg.addEventListener("pointerdown", (e) => {
      dragging = true; moved = false; startX = e.clientX;
      tg.setPointerCapture(e.pointerId);
      tg.classList.add("dragging");
    });
    tg.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      if (Math.abs(e.clientX - startX) > 4) moved = true;
      if (!moved) return;
      const rect = tg.getBoundingClientRect();
      const pxPerUnit = rect.width / 216;
      let x = (e.clientX - rect.left) / pxPerUnit - 32;   // จุดกึ่งกลางปุ่ม
      x = Math.max(0, Math.min(TRAVEL, x));
      knob.style.left = `calc(${x} * var(--u))`;
    });
    tg.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false;
      tg.classList.remove("dragging");
      if (moved) {
        const rect = tg.getBoundingClientRect();
        const pxPerUnit = rect.width / 216;
        const x = (e.clientX - rect.left) / pxPerUnit - 32;
        setOn(x > TRAVEL / 2);
      } else {
        setOn(!on);
      }
    });
    tg.addEventListener("pointercancel", () => {
      dragging = false; tg.classList.remove("dragging");
      knob.style.left = on ? `calc(${TRAVEL} * var(--u))` : "0";
    });
    tg.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); setOn(!on); }
      if (e.key === "ArrowRight") setOn(true);
      if (e.key === "ArrowLeft") setOn(false);
    });

    stage.append(val, tg);
  });
</script>
</body>
</html>
